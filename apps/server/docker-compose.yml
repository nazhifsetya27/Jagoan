# Jagoan server — runs behind the host's Caddy (public edge on :80/:443).
# Only Caddy is public; the Node app binds to loopback. Caddy reverse-proxies
# jagoan.nemoris.site -> 127.0.0.1:19220. (The old bundled nginx is gone — Caddy
# replaces it and handles TLS automatically.)
services:
  app:
    build: .
    container_name: jagoan-server
    restart: always
    # tiny-box tuning (1.9GB VPS): tiny Express app.
    mem_limit: 128m
    memswap_limit: 224m
    mem_reservation: 64m
    cpus: "0.5"
    env_file:
      - .env
    environment:
      - PORT=3000
    ports:
      - "127.0.0.1:19220:3000"
